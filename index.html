<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Explorer for Bevy</title>
  </head>
  <body>
    <div id="app">

      <div id="header">
        <a href="https://github.com/Zeophlite/bevy_system_explorer">Repository Link</a>
      </div>

      <div id="main">
        <div id="content">
          <div class="row">
            <h1 id="title">Loading</h1>
          </div>

          <div class="row">
            <div id="components-container" class="graph-container">
              <div class="graph-header">
                <h2>Components</h2>
                <div class="note">Click a component to add it and required to list</div>
              </div>
              <div id="components-graph" class="graph-content"></div>
            </div>
          </div>

          <div class="row">
            <div id="schedules-container" class="graph-container">
              <div class="graph-header">
                <h2>Schedules</h2>
                <div class="note">Click a schedule to add to list</div>
              </div>
              <div id="schedules-graph" class="graph-content"></div>
            </div>
          </div>

          <div class="row">
            <div id="systems-container" class="graph-container">
              <div class="graph-header">
                <h2>Systems</h2>
                <div class="note">Click a system to add to list</div>
                <button id="simplify-systems">Simplify</button>
              </div>
              <div id="systems-graph" class="graph-content"></div>
            </div>
          </div>
        </div>

        <div id="sidebar">
          <div>
            <h2>Selected Components</h2>
            <div id="selected-components"></div>
          </div>

          <div>
            <h2>Focused Components</h2>
            <div id="focused-components"></div>
          </div>

          <div>
            <h2>Selected Schedules</h2>
            <div id="selected-schedules"></div>
          </div>

          <div>
            <h2>Focused Schedules</h2>
            <div id="focused-schedules"></div>
          </div>

          <div>
            <h2>Selected Systems</h2>
            <div id="selected-systems"></div>
          </div>

          <div>
            <h2>Focused Systems</h2>
            <div id="focused-systems"></div>
          </div>
        </div>

      </div>


    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
